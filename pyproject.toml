[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secureagent"]

[tool.uv]
package = true

[project.scripts]
secureagent-api = "secureagent.main:run"


[project]
name = "secureagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langgraph",
    "fastapi",
    "pydantic",
    "uvicorn",
    "langfuse",
    "chromadb",
    "python-dotenv",
    "pytest>=9.0.3",
    "langchain-groq>=1.1.3",
    "ipython>=9.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
